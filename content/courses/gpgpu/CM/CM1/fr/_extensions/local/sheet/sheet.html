<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheet</title>

  <link rel="stylesheet" href="https://unpkg.com/@fortune-sheet/react/dist/index.umd.css">

  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@fortune-sheet/react/dist/index.umd.js"></script>

  <script>
    const data = [
      {
        name: "Feuille 1",
        row: 20,
        column: 8,
        celldata: [
          { r: 0, c: 0, v: { v: "Valeur" } },
          { r: 0, c: 1, v: { v: "Formule" } },
          { r: 1, c: 0, v: { v: 10 } },
          { r: 2, c: 0, v: { v: 20 } },
          { r: 3, c: 0, v: { v: 30 } },
          { r: 1, c: 1, v: { f: "=SUM(A2:A4)" } }
        ]
      }
    ];

    const Workbook = FortuneSheet.Workbook || window.FortuneSheet?.Workbook;
    ReactDOM.render(
      React.createElement(Workbook, { data }),
      document.getElementById("root")
    );
  </script>
</body>
</html>
