
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated GPU Icon</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    svg {
      width: min(90vw, 520px);
      height: auto;
      overflow: visible;
      font-family: Arial, Helvetica, sans-serif;
    }
    .fan {
      transform-box: fill-box;
      transform-origin: center;
      animation: spin 1.2s linear infinite;
    }
    .fan.slow {
      animation-duration: 1.6s;
    }
    .pixel-strip {
      animation: shimmer 1.8s steps(1) infinite;
    }
    .pixel-strip-2 {
      animation: shimmer2 2.2s steps(1) infinite;
    }
    .glow {
      animation: pulse 1.6s ease-in-out infinite;
    }
    .blink {
      animation: blink 1s steps(1) infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }
    @keyframes blink {
      0%, 60%, 100% { opacity: 1; }
      61%, 80% { opacity: 0.2; }
    }
    @keyframes shimmer {
      0% { opacity: 0.95; }
      25% { opacity: 0.7; }
      50% { opacity: 1; }
      75% { opacity: 0.8; }
      100% { opacity: 0.95; }
    }
    @keyframes shimmer2 {
      0% { opacity: 0.85; }
      20% { opacity: 1; }
      40% { opacity: 0.75; }
      60% { opacity: 0.95; }
      80% { opacity: 0.7; }
      100% { opacity: 0.85; }
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 520 420" aria-label="Icône GPU animée avec ventilateurs et image pixélisée">
    <defs>
      <linearGradient id="gpuBody" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2b2f39"/>
        <stop offset="100%" stop-color="#171a20"/>
      </linearGradient>
      <linearGradient id="screenBg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1f2430"/>
        <stop offset="100%" stop-color="#0d1016"/>
      </linearGradient>
      <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
      </filter>
    </defs>

    <!-- Pixelated image above -->
    <g filter="url(#softShadow)">
      <rect x="145" y="25" rx="18" ry="18" width="230" height="120" fill="url(#screenBg)" stroke="#3c4352" stroke-width="3"/>
      <g transform="translate(162 42)">
        <rect width="196" height="86" rx="10" fill="#0a0d12"/>
        <!-- sky / upper pixels -->
        <g class="pixel-strip">
          <rect x="0" y="0" width="28" height="22" fill="#7fd3ff"/>
          <rect x="28" y="0" width="28" height="22" fill="#58b8ff"/>
          <rect x="56" y="0" width="28" height="22" fill="#7fd3ff"/>
          <rect x="84" y="0" width="28" height="22" fill="#4ca4ff"/>
          <rect x="112" y="0" width="28" height="22" fill="#7fd3ff"/>
          <rect x="140" y="0" width="28" height="22" fill="#5fc0ff"/>
          <rect x="168" y="0" width="28" height="22" fill="#7fd3ff"/>
        </g>
        <!-- middle noisy pixels -->
        <g class="pixel-strip-2">
          <rect x="0" y="22" width="28" height="22" fill="#f96d6d"/>
          <rect x="28" y="22" width="28" height="22" fill="#ffe26d"/>
          <rect x="56" y="22" width="28" height="22" fill="#59d98e"/>
          <rect x="84" y="22" width="28" height="22" fill="#8f7dff"/>
          <rect x="112" y="22" width="28" height="22" fill="#ff8d4d"/>
          <rect x="140" y="22" width="28" height="22" fill="#41d3c8"/>
          <rect x="168" y="22" width="28" height="22" fill="#ff5db1"/>

          <rect x="0" y="44" width="28" height="22" fill="#232831"/>
          <rect x="28" y="44" width="28" height="22" fill="#ffffff"/>
          <rect x="56" y="44" width="28" height="22" fill="#232831"/>
          <rect x="84" y="44" width="28" height="22" fill="#ffffff"/>
          <rect x="112" y="44" width="28" height="22" fill="#232831"/>
          <rect x="140" y="44" width="28" height="22" fill="#ffffff"/>
          <rect x="168" y="44" width="28" height="22" fill="#232831"/>

          <rect x="0" y="66" width="28" height="20" fill="#ff914d"/>
          <rect x="28" y="66" width="28" height="20" fill="#ffcf4d"/>
          <rect x="56" y="66" width="28" height="20" fill="#95ff6d"/>
          <rect x="84" y="66" width="28" height="20" fill="#4dd3ff"/>
          <rect x="112" y="66" width="28" height="20" fill="#9c7dff"/>
          <rect x="140" y="66" width="28" height="20" fill="#ff66c4"/>
          <rect x="168" y="66" width="28" height="20" fill="#ff4d4d"/>
        </g>
      </g>
      <circle class="glow" cx="356" cy="43" r="5" fill="#54ff9f"/>
    </g>

    <!-- Connection cable -->
    <path d="M260 145 C260 175, 260 178, 260 198" fill="none" stroke="#5a6374" stroke-width="6" stroke-linecap="round"/>

    <!-- GPU body -->
    <g filter="url(#softShadow)">
      <rect x="75" y="195" rx="22" ry="22" width="370" height="155" fill="url(#gpuBody)" stroke="#4d5564" stroke-width="3"/>
      <rect x="445" y="225" width="22" height="100" rx="4" fill="#d6b36a"/>
      <rect x="455" y="232" width="3" height="10" fill="#8a6b31"/>
      <rect x="455" y="248" width="3" height="10" fill="#8a6b31"/>
      <rect x="455" y="264" width="3" height="10" fill="#8a6b31"/>
      <rect x="455" y="280" width="3" height="10" fill="#8a6b31"/>

      <rect x="95" y="212" rx="10" width="70" height="16" fill="#3a4250"/>
      <rect x="95" y="318" rx="10" width="120" height="14" fill="#3a4250"/>
      <rect x="328" y="212" rx="10" width="96" height="16" fill="#3a4250"/>

      <!-- Fans -->
      <g transform="translate(185 272)">
        <circle r="48" fill="#11151c" stroke="#545d6d" stroke-width="3"/>
        <circle r="39" fill="#1b2029"/>
        <g class="fan">
          <path d="M0 -32 C10 -26 15 -8 9 0 C3 6 -10 4 -18 -3 C-15 -14 -8 -26 0 -32Z" fill="#9098a8"/>
          <path d="M32 0 C26 10 8 15 0 9 C-6 3 -4 -10 3 -18 C14 -15 26 -8 32 0Z" fill="#9098a8"/>
          <path d="M0 32 C-10 26 -15 8 -9 0 C-3 -6 10 -4 18 3 C15 14 8 26 0 32Z" fill="#9098a8"/>
          <path d="M-32 0 C-26 -10 -8 -15 0 -9 C6 -3 4 10 -3 18 C-14 15 -26 8 -32 0Z" fill="#9098a8"/>
          <circle r="9" fill="#c7ced8"/>
        </g>
      </g>

      <g transform="translate(335 272)">
        <circle r="48" fill="#11151c" stroke="#545d6d" stroke-width="3"/>
        <circle r="39" fill="#1b2029"/>
        <g class="fan slow">
          <path d="M0 -32 C10 -26 15 -8 9 0 C3 6 -10 4 -18 -3 C-15 -14 -8 -26 0 -32Z" fill="#9098a8"/>
          <path d="M32 0 C26 10 8 15 0 9 C-6 3 -4 -10 3 -18 C14 -15 26 -8 32 0Z" fill="#9098a8"/>
          <path d="M0 32 C-10 26 -15 8 -9 0 C-3 -6 10 -4 18 3 C15 14 8 26 0 32Z" fill="#9098a8"/>
          <path d="M-32 0 C-26 -10 -8 -15 0 -9 C6 -3 4 10 -3 18 C-14 15 -26 8 -32 0Z" fill="#9098a8"/>
          <circle r="9" fill="#c7ced8"/>
        </g>
      </g>

      <!-- GPU label/details -->
      <rect x="92" y="238" rx="6" width="58" height="58" fill="#202632" stroke="#475062"/>
      <rect x="105" y="252" rx="4" width="32" height="30" fill="#59d98e" opacity="0.9"/>
      <circle class="blink" cx="122" cy="290" r="3.5" fill="#54ff9f"/>
      <rect x="240" y="322" rx="7" width="75" height="10" fill="#2e3543"/>
    </g>
  </svg>
</body>
</html>
